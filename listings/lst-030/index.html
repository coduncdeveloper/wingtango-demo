    <script>
      // Resolve the theme before first paint: stored choice, else OS preference.
      try {
        var t = localStorage.getItem('wingtango.theme')
        if (t !== 'light' && t !== 'dark')
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
